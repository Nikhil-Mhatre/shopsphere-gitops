{{- /*
------------------------------------------------------------------------------
PostgreSQL StatefulSet
------------------------------------------------------------------------------

This template deploys PostgreSQL as a Kubernetes StatefulSet.

Why StatefulSet instead of Deployment?

A StatefulSet is designed for stateful applications like databases.

Benefits:

✓ Stable Pod name
✓ Stable network identity
✓ Stable persistent storage
✓ Predictable Pod lifecycle

Example:

Pod Name:
iam-postgres-0

Even if the Pod is recreated, Kubernetes keeps the same Pod name
and reattaches the same Persistent Volume.

------------------------------------------------------------------------------
*/ -}}

apiVersion: apps/v1
kind: StatefulSet

metadata:
  # StatefulSet name.
  #
  # Example:
  #
  # iam-postgres
  #
  name: {{ include "postgres.fullname" . }}

  labels:
    {{- include "postgres.labels" . | nindent 4 }}

spec:

  # Kubernetes Service responsible for network identity.
  #
  # This Service must already exist.
  #
  serviceName: {{ include "postgres.fullname" . }}

  # Number of PostgreSQL Pods.
  #
  # This chart supports only a single PostgreSQL instance.
  #
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}

  template:

    metadata:

      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}

    spec:

      containers:

        - name: postgres

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:

            - name: postgres

              containerPort: {{ .Values.service.port }}

              protocol: TCP

          # Environment variables loaded from the Secret.
          env:

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgres.fullname" . }}
                  key: POSTGRES_PASSWORD

          # Mount PostgreSQL data directory.
          volumeMounts:

            - name: postgres-data

              mountPath: /var/lib/postgresql/data

          # Resource Requests & Limits
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # Startup Probe
          #
          # Allows PostgreSQL enough time to initialise.
          startupProbe:

            exec:

              command:

                - pg_isready

                - "-U"

                - "$(POSTGRES_USER)"

            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

            periodSeconds: {{ .Values.probes.startup.periodSeconds }}

          # Readiness Probe
          #
          # Determines when PostgreSQL is ready to
          # accept connections.
          readinessProbe:

            exec:

              command:

                - pg_isready

                - "-U"

                - "$(POSTGRES_USER)"

            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}

            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          # Liveness Probe
          #
          # Restarts PostgreSQL if it becomes unhealthy.
          livenessProbe:

            exec:

              command:

                - pg_isready

                - "-U"

                - "$(POSTGRES_USER)"

            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}

            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

      # Kubernetes scheduling configuration.
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

  # Persistent storage managed by the StatefulSet.
  #
  # Kubernetes automatically creates one PersistentVolumeClaim
  # for each Pod.
  #
  volumeClaimTemplates:

    - metadata:

        name: postgres-data

      spec:

        accessModes:

          - ReadWriteOnce

        {{- if .Values.storage.storageClassName }}

        storageClassName: {{ .Values.storage.storageClassName }}

        {{- end }}

        resources:

          requests:

            storage: {{ .Values.storage.size }}
