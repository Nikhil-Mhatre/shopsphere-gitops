# ------------------------------------------------------------------------------
# Argo CD Project
# ------------------------------------------------------------------------------
#
# Project Name
# ------------
#
# platform
#
# Purpose
# -------
#
# The Platform project manages shared Kubernetes infrastructure used by
# ShopSphere.
#
# Examples
#
# - NGINX Ingress Controller
# - cert-manager (future)
# - External Secrets Operator (future)
# - Monitoring Stack (future)
#
# Business applications such as Users, Catalog, Orders and Payments
# belong to the "services" project.
#
# ------------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:

  # Project name.
  #
  name: platform

  # Namespace where Argo CD is installed.
  #
  namespace: argocd

spec:

  # Human-readable description.
  #
  description: >
    Shared Kubernetes platform infrastructure for ShopSphere.

  # --------------------------------------------------------------------------
  # Source Repositories
  # --------------------------------------------------------------------------
  #
  # Git repositories and Helm repositories that applications within this
  # project are allowed to use.
  #
  sourceRepos:

    # ShopSphere GitOps repository.
    #
    - https://github.com/Nikhil-Mhatre/shopsphere-gitops.git

    # Official NGINX Ingress Helm repository.
    #
    - https://kubernetes.github.io/ingress-nginx

  # --------------------------------------------------------------------------
  # Destination Clusters
  # --------------------------------------------------------------------------
  #
  # Kubernetes clusters and namespaces where applications in this project
  # are allowed to deploy resources.
  #
  destinations:

    # Local Kubernetes cluster.
    #
    - server: https://kubernetes.default.svc

      # Platform namespaces.
      #
      namespace: ingress-nginx

    - server: https://kubernetes.default.svc

      namespace: cert-manager

    - server: https://kubernetes.default.svc

      namespace: monitoring

  # --------------------------------------------------------------------------
  # Cluster-Scoped Resources
  # --------------------------------------------------------------------------
  #
  # Allow management of cluster-wide resources.
  #
  clusterResourceWhitelist:

    - group: "*"

      kind: "*"

  # --------------------------------------------------------------------------
  # Namespace-Scoped Resources
  # --------------------------------------------------------------------------
  #
  # Allow management of namespace-scoped resources.
  #
  namespaceResourceWhitelist:

    - group: "*"

      kind: "*"
