# ------------------------------------------------------------------------------
# Argo CD Project
# ------------------------------------------------------------------------------
#
# Project Name
# ------------
#
# services
#
# Purpose
# -------
#
# The Services project manages all ShopSphere business applications.
#
# Examples
#
# - Users Service
# - Catalog Service
# - Orders Service
# - Inventory Service
# - Payment Service
# - Notification Service
#
# Every service owns its own namespace and supporting resources
# (Deployment, Service, ConfigMap, Secret, StatefulSet, etc.).
#
# Shared Kubernetes infrastructure such as the NGINX Ingress Controller
# belongs to the "platform" project.
#
# ------------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: AppProject

metadata:

  # Project name displayed in the Argo CD UI.
  #
  name: services

  # Namespace where Argo CD is installed.
  #
  namespace: argocd

spec:

  # Human-readable description.
  #
  description: >
    ShopSphere business applications.

  # --------------------------------------------------------------------------
  # Source Repositories
  # --------------------------------------------------------------------------
  #
  # Applications in this project may only deploy resources from
  # the ShopSphere GitOps repository.
  #
  sourceRepos:

    - https://github.com/Nikhil-Mhatre/shopsphere-gitops.git

  # --------------------------------------------------------------------------
  # Destination Clusters
  # --------------------------------------------------------------------------
  #
  # Applications may only deploy into service namespaces.
  #
  destinations:

    - server: https://kubernetes.default.svc
      namespace: "*"

  # --------------------------------------------------------------------------
  # Cluster-Scoped Resources
  # --------------------------------------------------------------------------
  #
  # Services should not create cluster-wide resources.
  #
  clusterResourceWhitelist: []

  # --------------------------------------------------------------------------
  # Namespace-Scoped Resources
  # --------------------------------------------------------------------------
  #
  # Allow management of namespace-scoped resources only.
  #
  namespaceResourceWhitelist:

    - group: "*"
      kind: "*"
