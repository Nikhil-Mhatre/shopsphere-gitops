---
# Source: postgres/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount

metadata:
  name: user-db-postgres
  labels:
    helm.sh/chart: "postgres-0.1.0"
    app.kubernetes.io/name: "postgres"
    app.kubernetes.io/instance: "user-db"
    app.kubernetes.io/version: "17.6"
    app.kubernetes.io/managed-by: "Helm"

automountServiceAccountToken: false

---
# Source: postgres/templates/secret.yaml
apiVersion: v1
kind: Secret

metadata:
  name: user-db-postgres
  labels:
    helm.sh/chart: "postgres-0.1.0"
    app.kubernetes.io/name: "postgres"
    app.kubernetes.io/instance: "user-db"
    app.kubernetes.io/version: "17.6"
    app.kubernetes.io/managed-by: "Helm"

type: Opaque

stringData:
  POSTGRES_DB: "user_db"
  POSTGRES_USER: "user_service"
  POSTGRES_PASSWORD: "user_service_password"

---
# Source: postgres/templates/service.yaml
apiVersion: v1
kind: Service

metadata:
  name: user-db-postgres
  labels:
    helm.sh/chart: "postgres-0.1.0"
    app.kubernetes.io/name: "postgres"
    app.kubernetes.io/instance: "user-db"
    app.kubernetes.io/version: "17.6"
    app.kubernetes.io/managed-by: "Helm"

spec:
  type: ClusterIP
  clusterIP: None

  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: user-db

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP

---
# Source: postgres/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: user-db-postgres
  labels:
    helm.sh/chart: "postgres-0.1.0"
    app.kubernetes.io/name: "postgres"
    app.kubernetes.io/instance: "user-db"
    app.kubernetes.io/version: "17.6"
    app.kubernetes.io/managed-by: "Helm"

spec:
  serviceName: user-db-postgres
  replicas: 1

  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: user-db

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: user-db

    spec:
      serviceAccountName: user-db-postgres
      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: postgres

          image: "postgres:17.6"
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: user-db-postgres
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-db-postgres
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-db-postgres
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pg_isready \
                    -h 127.0.0.1 \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pg_isready \
                    -h 127.0.0.1 \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  pg_isready \
                    -h 127.0.0.1 \
                    -U "$POSTGRES_USER" \
                    -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
        labels:
          
        helm.sh/chart: "postgres-0.1.0"
        app.kubernetes.io/name: "postgres"
        app.kubernetes.io/instance: "user-db"
        app.kubernetes.io/version: "17.6"
        app.kubernetes.io/managed-by: "Helm"

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 5Gi
