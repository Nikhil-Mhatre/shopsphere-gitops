replicaCount: 3

image:
  repository: nikhilmhatre0317/shopsphere-user-service
  tag: "84152f3"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: api.example.com
  path: /

networkPolicy:
  enabled: true
