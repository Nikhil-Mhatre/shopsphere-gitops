# ------------------------------------------------------------------------------
# NGINX Ingress Controller
# Production Environment Configuration
# ------------------------------------------------------------------------------
#
# Purpose
# -------
#
# This file contains configuration that is specific to the
# Production environment.
#
# Values defined here override the defaults in:
#
# charts/ingress-nginx/values.yaml
#
# Keep this file small.
# Only include settings that differ from the default configuration.
#
# ------------------------------------------------------------------------------

controller:

  # --------------------------------------------------------------------------
  # Replica Configuration
  # --------------------------------------------------------------------------

  # Run multiple controller Pods to improve availability.
  #
  replicaCount: 2

  # --------------------------------------------------------------------------
  # Kubernetes Service
  # --------------------------------------------------------------------------

  service:

    # Production clusters typically expose the Ingress Controller
    # through a cloud provider's external LoadBalancer.
    #
    type: LoadBalancer

  # --------------------------------------------------------------------------
  # Resource Management
  # --------------------------------------------------------------------------

  resources:

    requests:

      cpu: 100m

      memory: 128Mi

    limits:

      cpu: 500m

      memory: 512Mi

  # --------------------------------------------------------------------------
  # Metrics
  # --------------------------------------------------------------------------

  metrics:

    # Enable metrics so they can be collected by
    # Prometheus when a monitoring stack is added.
    #
    enabled: true
