# ------------------------------------------------------------------------------
# PostgreSQL Production Environment
# ------------------------------------------------------------------------------
#
# This file overrides the default PostgreSQL Helm chart values for the
# production environment.
#
# Only values that differ from the chart defaults should be defined here.
#
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# PostgreSQL Image
# ------------------------------------------------------------------------------

image:

  # Use a fixed PostgreSQL version in production.
  #
  tag: "17"

# ------------------------------------------------------------------------------
# Database Configuration
# ------------------------------------------------------------------------------

database:

  # Production database.
  #
  name: user

  # Application database user.
  #
  username: postgres

  # Production password.
  #
  # Replace this value with a secure password
  # or integrate with an external secret manager.
  #
  password: replace-with-secure-password

# ------------------------------------------------------------------------------
# Persistent Storage
# ------------------------------------------------------------------------------

storage:

  # Larger persistent storage for production.
  #
  size: 20Gi

# ------------------------------------------------------------------------------
# Resource Requests & Limits
# ------------------------------------------------------------------------------

resources:

  requests:

    cpu: 500m

    memory: 512Mi

  limits:

    cpu: "1"

    memory: 1Gi
