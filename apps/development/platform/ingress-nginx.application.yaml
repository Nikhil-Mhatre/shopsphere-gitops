# ------------------------------------------------------------------------------
# Argo CD Application
# ------------------------------------------------------------------------------
#
# Purpose
# -------
#
# Deploy the NGINX Ingress Controller into the Development environment.
#
# Unlike ShopSphere services, the NGINX Ingress Controller is deployed
# directly from the official Helm chart maintained by the Kubernetes
# Ingress-NGINX project.
#
# Environment-specific configuration is stored inside this GitOps repository.
#
# Architecture
# ------------
#
#          Official Helm Repository
#                     │
#                     ▼
#             ingress-nginx Chart
#                     │
#                     ▼
#                 Argo CD
#                     ▲
#                     │
#         ShopSphere GitOps Repository
#                     │
#                     ▼
#     environments/development/ingress-nginx.values.yaml
#
# ------------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  # Application name displayed in the Argo CD UI.
  #
  name: development-ingress-nginx

  # Namespace where Argo CD is installed.
  #
  namespace: argocd

spec:

  # Argo CD Project.
  #
  project: default

  # --------------------------------------------------------------------------
  # Sources
  # --------------------------------------------------------------------------
  #
  # Source 1
  # --------
  #
  # Official Helm chart.
  #
  # Source 2
  # --------
  #
  # GitOps repository containing the environment values.
  #
  sources:

    # ------------------------------------------------------------------------
    # Official Helm Chart
    # ------------------------------------------------------------------------

    - repoURL: https://kubernetes.github.io/ingress-nginx

      chart: ingress-nginx

      targetRevision: 4.13.2

      helm:

        releaseName: ingress-nginx

        valueFiles:

          - $values/environments/development/ingress-nginx.values.yaml

    # ------------------------------------------------------------------------
    # GitOps Repository
    # ------------------------------------------------------------------------

    - repoURL: https://github.com/Nikhil-Mhatre/shopsphere-gitops.git

      targetRevision: main

      ref: values

  # --------------------------------------------------------------------------
  # Destination
  # --------------------------------------------------------------------------

  destination:

    # Deploy into the Kubernetes cluster managed by Argo CD.
    #
    server: https://kubernetes.default.svc

    # Namespace where the controller will run.
    #
    namespace: ingress-nginx

  # --------------------------------------------------------------------------
  # Synchronization Policy
  # --------------------------------------------------------------------------

  syncPolicy:

    automated:

      # Remove resources that no longer exist in Git.
      #
      prune: true

      # Restore manually modified resources.
      #
      selfHeal: true

    syncOptions:

      # Automatically create the namespace if it
      # does not already exist.
      #
      - CreateNamespace=true
