# ------------------------------------------------------------------------------
# Argo CD Application
# ------------------------------------------------------------------------------
#
# Deploys the NGINX Ingress Controller into the Development environment.
#
# The NGINX Ingress Controller acts as the entry point for all incoming
# HTTP/HTTPS traffic into the Kubernetes cluster.
#
# Example
#
#                 http://api.shopsphere.local
#                            │
#                            ▼
#                 NGINX Ingress Controller
#                            │
#        ┌───────────────────┼───────────────────┐
#        ▼                   ▼                   ▼
#   /api/v1/auth      /api/v1/catalog     /api/v1/orders
#        │                   │                   │
#        ▼                   ▼                   ▼
#       user               Catalog             Orders
#
# This Application deploys the local wrapper Helm chart located in:
#
#   charts/ingress-nginx
#
# Environment-specific configuration is loaded from:
#
#   environments/development/ingress-nginx.values.yaml
#
# ------------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  # Name displayed in the Argo CD UI.
  #
  name: ingress-nginx-development

  # Namespace where Argo CD is installed.
  #
  namespace: argocd

spec:

  # Argo CD Project.
  #
  project: default

  # --------------------------------------------------------------------------
  # Source Repository
  # --------------------------------------------------------------------------

  source:

    # GitOps repository.
    #
    repoURL: https://github.com/Nikhil-Mhatre/shopsphere-gitops.git

    # Git branch to monitor.
    #
    targetRevision: main

    # Path to the wrapper Helm chart.
    #
    path: charts/ingress-nginx

    helm:

      # Stable Helm release name.
      #
      releaseName: ingress-nginx

      # Development environment values.
      #
      valueFiles:

        - ../../environments/development/ingress-nginx.values.yaml

  # --------------------------------------------------------------------------
  # Destination Cluster
  # --------------------------------------------------------------------------

  destination:

    # Kubernetes API server.
    #
    server: https://kubernetes.default.svc

    # Namespace where the Ingress Controller
    # will be installed.
    #
    namespace: ingress-nginx

  # --------------------------------------------------------------------------
  # Synchronization Policy
  # --------------------------------------------------------------------------

  syncPolicy:

    automated:

      # Remove resources that no longer exist in Git.
      #
      prune: true

      # Restore manually modified resources.
      #
      selfHeal: true

    syncOptions:

      # Automatically create the namespace if it
      # does not already exist.
      #
      - CreateNamespace=true
