# ------------------------------------------------------------------------------
# Argo CD Application
# ------------------------------------------------------------------------------
#
# Deploys the users Helm chart to the Production environment.
#
# ------------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  # Application name displayed in the Argo CD UI.
  #
  name: users-production

  namespace: argocd

spec:

  project: default

  # --------------------------------------------------------------------------
  # Source Repository
  # --------------------------------------------------------------------------

  source:

    repoURL: https://github.com/Nikhil-Mhatre/shopsphere-gitops.git

    targetRevision: main

    path: charts/users

    helm:

      # Stable Helm release name.
      #
      releaseName: users

      # Production configuration.
      #
      valueFiles:
        - ../../environments/production/users.values.yaml

  # --------------------------------------------------------------------------
  # Destination Cluster
  # --------------------------------------------------------------------------

  destination:

    server: https://kubernetes.default.svc

    namespace: production

  # --------------------------------------------------------------------------
  # Synchronization Policy
  # --------------------------------------------------------------------------

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true
