# ------------------------------------------------------------------------------
# Argo CD Root Application
# ------------------------------------------------------------------------------
#
# This is the root (App of Apps) application for the Development
# environment.
#
# Purpose
# -------
#
# This application does NOT deploy any Kubernetes workloads directly.
#
# Instead, it deploys and manages the child Argo CD Applications found
# under:
#
#   applications/development/
#
# Those child Applications are responsible for deploying individual
# microservices and infrastructure components.
#
# Development Environment
#
# ├── postgres-dev
# ├── iam-dev
# ├── catalog-dev      (future)
# ├── order-dev        (future)
# └── ...
#
# Benefits
# --------
#
# • Bootstrap the entire development environment with a single command.
# • Automatically discover newly added applications.
# • Keep Argo CD configuration separate from Helm charts.
# • Maintain a simple GitOps workflow.
#
# ------------------------------------------------------------------------------

apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  # Name displayed in the Argo CD UI.
  #
  name: dev

  # Namespace where Argo CD is installed.
  #
  namespace: argocd

spec:

  # Argo CD project.
  #
  project: default

  # --------------------------------------------------------------------------
  # Source Repository
  # --------------------------------------------------------------------------

  source:

    # GitOps repository.
    #
    repoURL: https://github.com/Nikhil-Mhatre/shopsphere-gitops.git

    # Git branch to monitor.
    #
    targetRevision: main

    # Directory containing all Development Applications.
    #
    path: applications/development

  # --------------------------------------------------------------------------
  # Destination Cluster
  # --------------------------------------------------------------------------

  destination:

    # In-cluster Kubernetes API.
    #
    server: https://kubernetes.default.svc

    # Namespace where the child Applications
    # are created.
    #
    namespace: argocd

  # --------------------------------------------------------------------------
  # Synchronization Policy
  # --------------------------------------------------------------------------

  syncPolicy:

    automated:

      # Remove child Applications that no longer
      # exist in Git.
      #
      prune: true

      # Restore manually modified Applications.
      #
      selfHeal: true
