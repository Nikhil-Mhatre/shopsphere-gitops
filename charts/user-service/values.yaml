replicaCount: 2
image:
  repository: nikhilmhatre0317/shopsphere-user-service
  tag: "84152f3"
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
service:
  type: ClusterIP
  port: 8080
container:
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
livenessProbe:
  path: /api/v1/health
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  path: /api/v1/health
  initialDelaySeconds: 5
  periodSeconds: 10
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: false
  className: nginx
networkPolicy:
  enabled: false
