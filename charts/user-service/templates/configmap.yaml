apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "user-service.fullname" . }}

  labels:
    {{- include "user-service.labels" . | nindent 4 }}

data:

  NODE_ENV: {{ .Values.config.nodeEnv | quote }}

  HOST: {{ .Values.config.host | quote }}

  PORT: {{ .Values.config.port | quote }}

  SERVICE_NAME: {{ .Values.config.serviceName | quote }}

  SERVICE_VERSION: {{ .Values.config.serviceVersion | quote }}

  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  DATABASE_CONNECT_TIMEOUT_MS: {{ .Values.database.connectionTimeout | quote }}

  DATABASE_LOG_QUERIES: {{ .Values.database.logQueries | quote }}
