{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "user-service.fullname" . }}

spec:

  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: user.example.com

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: {{ include "user-service.fullname" . }}
                port:
                  number: {{ .Values.service.port }}

{{- end }}
