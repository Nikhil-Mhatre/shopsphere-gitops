apiVersion: v1
kind: Service
metadata:
  name: {{ include "user-service.fullname" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "user-service.selectorLabels" . | nindent 4 }}

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.container.port }}
