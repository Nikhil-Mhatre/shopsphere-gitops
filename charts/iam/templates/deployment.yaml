{{- /*
------------------------------------------------------------------------------
IAM Deployment
------------------------------------------------------------------------------

This template deploys the IAM application as a Kubernetes Deployment.

Why use a Deployment?

A Deployment manages stateless application Pods.

It provides:

- Rolling updates
- Automatic Pod recreation
- Horizontal scaling
- Self-healing

Unlike PostgreSQL, the IAM application does not maintain persistent
application state. Therefore a Deployment is the appropriate workload.

------------------------------------------------------------------------------
*/ -}}

apiVersion: apps/v1
kind: Deployment

metadata:
  # Deployment name.
  #
  # Example:
  #
  # iam
  #
  name: {{ include "iam.fullname" . }}

  labels:
    {{- include "iam.labels" . | nindent 4 }}

spec:

  # Number of application Pods.
  #
  replicas: {{ .Values.replicaCount }}

  selector:

    matchLabels:
      {{- include "iam.selectorLabels" . | nindent 6 }}

  template:

    metadata:

      labels:
        {{- include "iam.selectorLabels" . | nindent 8 }}

    spec:

      # ServiceAccount used by the application.
      #
      serviceAccountName: {{ include "iam.serviceAccountName" . }}

      containers:

        - name: {{ include "iam.name" . }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:

            - name: http

              containerPort: {{ .Values.application.port }}

              protocol: TCP

          # --------------------------------------------------------------
          # Environment Variables
          # --------------------------------------------------------------

          # Load all non-sensitive configuration
          # from the ConfigMap.
          #
          envFrom:

            - configMapRef:

                name: {{ include "iam.fullname" . }}

          # Load sensitive configuration
          # from the Kubernetes Secret.
          #
          env:

            - name: DATABASE_URL

              valueFrom:

                secretKeyRef:

                  name: {{ include "iam.fullname" . }}

                  key: DATABASE_URL

          # --------------------------------------------------------------
          # Health Probes
          # --------------------------------------------------------------

          startupProbe:

            httpGet:

              path: {{ .Values.probes.startup.path }}

              port: http

            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

            periodSeconds: {{ .Values.probes.startup.periodSeconds }}

          readinessProbe:

            httpGet:

              path: {{ .Values.probes.readiness.path }}

              port: http

            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}

            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          livenessProbe:

            httpGet:

              path: {{ .Values.probes.liveness.path }}

              port: http

            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}

            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}

          # --------------------------------------------------------------
          # Resource Requests & Limits
          # --------------------------------------------------------------

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      # --------------------------------------------------------------
      # Kubernetes Scheduling
      # --------------------------------------------------------------

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}

      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
