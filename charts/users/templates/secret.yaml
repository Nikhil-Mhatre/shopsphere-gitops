{{- /*
------------------------------------------------------------------------------
users Secret
------------------------------------------------------------------------------

This template creates a Kubernetes Secret that stores sensitive
configuration required by the users application.

Why use a Secret?

A Secret is used to store confidential information such as:

- Database passwords
- API Keys
- Access Tokens
- Private Keys
- Connection Strings

Unlike a ConfigMap, Secret values should never be committed with
production credentials.

For this chart, the application expects a single DATABASE_URL
environment variable.

The Helm chart constructs the connection string using the individual
database configuration values defined in values.yaml.

This keeps the application independent of Kubernetes while making the
database configuration easy for DevOps engineers to understand.

------------------------------------------------------------------------------
*/ -}}

apiVersion: v1
kind: Secret

metadata:
  # Secret name.
  #
  # Example:
  #
  # users
  #
  name: {{ include "users.fullname" . }}

  labels:
    {{- include "users.labels" . | nindent 4 }}

# Generic Kubernetes Secret.
#
type: Opaque

# stringData allows plain text values.
#
# Kubernetes automatically converts these
# values into Base64 when the Secret is created.
#
# This makes the YAML easier to read and review.
#
stringData:

  # --------------------------------------------------------------------------
  # PostgreSQL Connection String
  # --------------------------------------------------------------------------
  #
  # Generated format:
  #
  # postgresql://usersname:password@host:port/database
  #
  # Example:
  #
  # postgresql://postgres:password@users-postgres:5432/users
  #
  DATABASE_URL: >-
    postgresql://{{ .Values.database.usersname }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}
