{{- /*
------------------------------------------------------------------------------
users ServiceAccount
------------------------------------------------------------------------------

This template creates a dedicated Kubernetes ServiceAccount for the
users application.

What is a ServiceAccount?

Every Pod in Kubernetes runs as a ServiceAccount.

A ServiceAccount represents the application's identity when interacting
with the Kubernetes API.

Why create a dedicated ServiceAccount?

Although the users application currently does not communicate directly with
the Kubernetes API, using a dedicated ServiceAccount provides several
benefits:

- Every application has its own identity.
- Future RBAC permissions can be granted without modifying the Deployment.
- Follows Kubernetes best practices.
- Keeps all microservice Helm charts consistent.

If serviceAccount.create is set to false, the application will use the
namespace's default ServiceAccount instead.

------------------------------------------------------------------------------
*/ -}}

{{- if .Values.serviceAccount.create }}

apiVersion: v1
kind: ServiceAccount

metadata:
  # ServiceAccount name.
  #
  # Example:
  #
  # users
  #
  name: {{ include "users.serviceAccountName" . }}

  labels:
    {{- include "users.labels" . | nindent 4 }}

# Automatically mount the ServiceAccount token.
#
# This can be disabled in the future if the application
# never needs to communicate with the Kubernetes API.
#
automountServiceAccountToken: true

{{- end }}
