{{- /*
------------------------------------------------------------------------------
users ConfigMap
------------------------------------------------------------------------------

This template creates a Kubernetes ConfigMap that stores the users
application's non-sensitive configuration.

Why use a ConfigMap?

A ConfigMap allows application configuration to be managed separately
from the Docker image.

Benefits:

- Configuration can change without rebuilding the image.
- Different environments (Development, Production) can have different
  configuration.
- Non-sensitive values remain readable and easy to maintain.

Sensitive values such as passwords and database connection strings
must NOT be stored in a ConfigMap.

Those belong inside a Kubernetes Secret.

------------------------------------------------------------------------------
*/ -}}

apiVersion: v1
kind: ConfigMap

metadata:
  # ConfigMap name.
  #
  # Example:
  #
  # users
  #
  name: {{ include "users.fullname" . }}

  labels:
    {{- include "users.labels" . | nindent 4 }}

data:

  # --------------------------------------------------------------------------
  # Application Configuration
  # --------------------------------------------------------------------------

  # Application runtime environment.
  #
  # Examples:
  #
  # development
  # production
  #
  NODE_ENV: {{ .Values.application.environment | quote }}

  # Host interface the application listens on.
  #
  # Inside Kubernetes this should normally be:
  #
  # 0.0.0.0
  #
  HOST: {{ .Values.application.host | quote }}

  # HTTP server port.
  #
  PORT: {{ .Values.application.port | quote }}

  # Application name.
  #
  # Used for logging, monitoring and observability.
  #
  SERVICE_NAME: {{ .Values.application.name | quote }}

  # Application version.
  #
  SERVICE_VERSION: {{ .Values.application.version | quote }}

  # Application log level.
  #
  LOG_LEVEL: {{ .Values.application.logLevel | quote }}

  # --------------------------------------------------------------------------
  # Database Configuration
  # --------------------------------------------------------------------------

  # Database connection timeout in milliseconds.
  #
  DATABASE_CONNECT_TIMEOUT_MS: {{ .Values.database.connectTimeoutMs | quote }}

  # Enable or disable Prisma query logging.
  #
  DATABASE_LOG_QUERIES: {{ .Values.database.logQueries | quote }}
