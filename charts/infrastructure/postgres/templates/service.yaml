apiVersion: v1
kind: Service

metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}
  clusterIP: None

  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}

  ports:
    - name: postgres
      port: {{ .Values.service.port }}
      targetPort: postgres
      protocol: TCP
