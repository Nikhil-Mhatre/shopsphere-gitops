# charts/infrastructure/postgres/values.yaml

# ------------------------------------------------------------------------------
# PostgreSQL Helm Chart - Default Values
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Replica Configuration
# ------------------------------------------------------------------------------
replicaCount: 1

# ------------------------------------------------------------------------------
# Container Image
# ------------------------------------------------------------------------------
image:
  repository: postgres
  tag: "17.6"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ------------------------------------------------------------------------------
# Service Configuration
# ------------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 5432

# ------------------------------------------------------------------------------
# Database Configuration
# ------------------------------------------------------------------------------
database:
  name: postgres

# ------------------------------------------------------------------------------
# Authentication
#
# Development:
#   existingSecret: ""
#   username/password will be used to create a Secret.
#
# Production:
#   Set existingSecret and manage credentials externally.
# ------------------------------------------------------------------------------
auth:
  username: postgres
  password: postgres
  existingSecret: ""

# ------------------------------------------------------------------------------
# Persistent Storage
# ------------------------------------------------------------------------------
storage:
  size: 5Gi

  # Leave empty to use the cluster's default StorageClass.
  storageClass: ""

# ------------------------------------------------------------------------------
# Service Account
# ------------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ------------------------------------------------------------------------------
# Pod Annotation
# ------------------------------------------------------------------------------
podAnnotations: {}

# ------------------------------------------------------------------------------
# Pod Security Context
# ------------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 999
  fsGroupChangePolicy: OnRootMismatch

# ------------------------------------------------------------------------------
# Container Security Context
# ------------------------------------------------------------------------------
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

# ------------------------------------------------------------------------------
# Resource Requests & Limits
# ------------------------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

# ------------------------------------------------------------------------------
# Health Probes
# ------------------------------------------------------------------------------
probes:
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30

  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  liveness:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 6

# ------------------------------------------------------------------------------
# Pod Scheduling
# ------------------------------------------------------------------------------
nodeSelector: {}

affinity: {}

tolerations: []

# ------------------------------------------------------------------------------
# Pod Lifecycle
# ------------------------------------------------------------------------------
terminationGracePeriodSeconds: 60
