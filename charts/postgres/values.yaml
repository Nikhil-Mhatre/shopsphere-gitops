# ------------------------------------------------------------------------------
# PostgreSQL Helm Chart Configuration
# ------------------------------------------------------------------------------
#
# This file contains all configurable values for the PostgreSQL Helm chart.
#
# During installation, Helm combines these values with the templates
# located inside the templates/ directory to generate Kubernetes manifests.
#
# Example:
#
#   helm install postgres ./charts/postgres
#
# Override values:
#
#   helm install postgres ./charts/postgres \
#     --values values.yaml
#
# Environment-specific values should be placed inside:
#
#   dev/postgres/values.yaml
#   prod/postgres/values.yaml
#
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Deployment Information
# ------------------------------------------------------------------------------

# Number of PostgreSQL Pods.
#
# PostgreSQL is a stateful application.
# Only one replica is supported by this chart.
#
replicaCount: 1

# ------------------------------------------------------------------------------
# PostgreSQL Docker Image
# ------------------------------------------------------------------------------

image:

  # Docker image repository.
  #
  # Official PostgreSQL image:
  # https://hub.docker.com/_/postgres
  #
  repository: postgres

  # PostgreSQL image tag.
  #
  # Keep this version aligned with appVersion
  # inside Chart.yaml.
  #
  tag: "17"

  # Image pull policy.
  #
  # Always
  # IfNotPresent
  # Never
  #
  pullPolicy: IfNotPresent

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration
# ------------------------------------------------------------------------------

database:

  # Database name created during container startup.
  #
  # Example:
  #
  # user
  # catalog
  # order
  #
  name: app

  # Application database user.
  #
  username: postgres

  # Application database password.
  #
  # NOTE:
  # Never commit production passwords.
  #
  # Override this value in the environment-specific
  # values.yaml file.
  #
  password: change-me

# ------------------------------------------------------------------------------
# Kubernetes Service
# ------------------------------------------------------------------------------

service:

  # Kubernetes Service type.
  #
  # ClusterIP is recommended because PostgreSQL
  # should only be accessible from inside the cluster.
  #
  type: ClusterIP

  # PostgreSQL port.
  #
  port: 5432

# ------------------------------------------------------------------------------
# Persistent Storage
# ------------------------------------------------------------------------------

storage:

  # Persistent Volume size.
  #
  # Examples:
  #
  # 1Gi
  # 5Gi
  # 10Gi
  #
  size: 5Gi

  # Storage Class.
  #
  # Leave empty to use the cluster's
  # default StorageClass.
  #
  storageClassName: ""

# ------------------------------------------------------------------------------
# Resource Requests & Limits
# ------------------------------------------------------------------------------

resources:

  requests:

    cpu: 100m

    memory: 128Mi

  limits:

    cpu: 500m

    memory: 512Mi

# ------------------------------------------------------------------------------
# Health Probes
# ------------------------------------------------------------------------------

probes:

  startup:

    failureThreshold: 30

    periodSeconds: 10

  readiness:

    initialDelaySeconds: 10

    periodSeconds: 10

  liveness:

    initialDelaySeconds: 30

    periodSeconds: 20

# ------------------------------------------------------------------------------
# Pod Scheduling
# ------------------------------------------------------------------------------

# Schedule Pods onto specific Kubernetes nodes.
#
# Leave empty unless your cluster
# requires custom scheduling.
#
nodeSelector: {}

# Pod affinity rules.
#
# Leave empty for most deployments.
#
affinity: {}

# Kubernetes tolerations.
#
# Leave empty unless the cluster
# uses taints.
#
tolerations: []
