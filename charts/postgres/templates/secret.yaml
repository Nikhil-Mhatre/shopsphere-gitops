{{- /*
------------------------------------------------------------------------------
PostgreSQL Secret
------------------------------------------------------------------------------

This template creates a Kubernetes Secret that stores the PostgreSQL
credentials required by the PostgreSQL container.

The Secret contains:

- POSTGRES_DB
- POSTGRES_USER
- POSTGRES_PASSWORD

These values are injected into the PostgreSQL container as environment
variables by the StatefulSet.

NOTE

For learning purposes and local development, the password is provided
through values.yaml.

For production environments, override these values from:

    prod/postgres/values.yaml

or replace this Secret entirely with an external secret management solution.

------------------------------------------------------------------------------
*/ -}}

apiVersion: v1
kind: Secret

metadata:
  # Resource name.
  #
  # Example:
  #
  # user-postgres
  #
  name: {{ include "postgres.fullname" . }}

  labels:
    {{- include "postgres.labels" . | nindent 4 }}

# Kubernetes Secret type.
#
# Opaque is the default type for generic key/value secrets.
#
type: Opaque

# stringData allows us to write plain text values.
#
# Kubernetes automatically converts these values
# into Base64-encoded data before storing them.
#
# This makes the YAML easier to read and maintain.
#
stringData:

  # Database name created during PostgreSQL initialization.
  POSTGRES_DB: {{ .Values.database.name | quote }}

  # Database user created during PostgreSQL initialization.
  POSTGRES_USER: {{ .Values.database.username | quote }}

  # Password assigned to the database user.
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
